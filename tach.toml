interfaces = []
exclude = [
    "**/*__pycache__",
    "**/*egg-info",
    "**/docs",
    "**/tests",
    "**/venv",
]
source_roots = ["src"]

[[modules]]
path = "tsdm"
depends_on = [
    "tsdm.backend",
    "tsdm.datasets",
    "tsdm.datatools",
    "tsdm.encoders",
    "tsdm.linalg",
    "tsdm.logutils",
    "tsdm.metrics",
    "tsdm.random",
    "tsdm.tasks",
    "tsdm.timeseries",
    "tsdm.types",
    "tsdm.viz",
    "tsdm.pretrained"
]

[[modules]]
path = "tsdm.config"
depends_on = []
utility = true

[[modules]]
path = "tsdm.constants"
depends_on = []
utility = true

[[modules]]
path = "tsdm.types"
depends_on = []

[[modules]]
path = "tsdm.testing"
depends_on = ["tsdm.types", "tsdm.datatools"]

[[modules]]
path = "tsdm.pprint"
depends_on = ["tsdm.types", "tsdm.testing", "tsdm.decorator", "tsdm.datatools"]
utility = true

[[modules]]
path = "tsdm.utils"
depends_on = ["tsdm.types", "tsdm.testing"]
utility = true

[[modules]]
path = "tsdm.backend"
depends_on = ["tsdm.types"]

[[modules]]
path = "tsdm.viz"
depends_on = []

[[modules]]
path = "tsdm.metrics"
depends_on = ["tsdm.types"]

[[modules]]
path = "tsdm.random"
depends_on = ["tsdm.types", "tsdm.datatools"]

[[modules]]
path = "tsdm.encoders"
depends_on = [
    "tsdm.types",
    "tsdm.encoders.universal", "tsdm.testing",
]

[[modules]]
path = "tsdm.linalg"
depends_on = ["tsdm.types"]

[[modules]]
path = "tsdm.timeseries"
depends_on = ["tsdm.datasets", "tsdm.datatools"]

[[modules]]
path = "tsdm.logutils"
depends_on = ["tsdm.types", "tsdm.metrics", "tsdm.viz", "tsdm.linalg", "tsdm.datatools"]

[[modules]]
path = "tsdm.datasets"
depends_on = [
    "tsdm.datatools",
    "tsdm.random",
    "tsdm.testing",
    "tsdm.types",
]

[[modules]]
path = "tsdm.tasks"
depends_on = [
    "tsdm.datasets",
    "tsdm.datatools",
    "tsdm.encoders",
    "tsdm.metrics",
    "tsdm.random",
    "tsdm.timeseries", "tsdm.types"
]


[[modules]]
path = "tsdm.datatools"
depends_on = ["tsdm.types", "tsdm.backend"]

[[modules]]
path = "tsdm.encoders.universal"
depends_on = [
    "tsdm.backend",
    "tsdm.encoders",
    "tsdm.linalg",
    "tsdm.types", "tsdm.datatools",
]

[[modules]]
path = "numerical_types"
depends_on = []

[[modules]]
path = "tsdm.pretrained"
depends_on = ["tsdm.testing", "tsdm.encoders", "tsdm.types"]

[[modules]]
path = "tsdm.decorator"
depends_on = ["tsdm.types"]
