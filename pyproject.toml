[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

# region project configuration ---------------------------------------------------------
[project]
name = "tsdm"
version = "0.7.0"
authors = [{ name = "Randolf Scholz", email = "randolf.scholz@gmail.com" }]
description = "Time-Series Datasets and Models"

# package content
license = { file = "LICENSE" }
readme = "README.md"

# meta-information
keywords = ["time-series", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 12.6",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
    "Operating System :: POSIX :: Linux",
]

# dependencies
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.2.3",
    "pandas>=2.2.3",
    "pillow>=11.1.0",
    "polars>=1.22.0",
    "pyarrow>=19.0.0",
    "pydantic>=2.10.6",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.1",
    "tensorboard>=2.19.0",
    "torch>=2.6.0",
    "tqdm>=4.67.1",
    "typing-extensions>=4.12.2",
]

[project.urls]
repository = "https://github.com/randolf-scholz/tsdm.git"
# endregion project configuration ------------------------------------------------------


# region development dependencies ------------------------------------------------------
[dependency-groups]
dev = [
    {include-group="devtools"}, {include-group="docs"}, {include-group="debug"},
    {include-group="linters"}, {include-group="tests"}, {include-group="typing"},
]
devtools = [
    "cmake>=3.31.4",
    "ninja>=1.11.1.3",
    "pybadges>=3.0.1",
]
debug = [
    "ipympl>=0.9.6",
    "ipywidgets>=8.1.5",
    "jupyterlab-execute-time>=3.2.0",
    "jupyterlab>=4.3.5",
    "psutil>=7.0.0",
    "torchinfo>=1.8.0",
]
docs = [
    "docutils>=0.21.2",
    "myst-parser>=4.0.1",
    "nbsphinx>=0.9.6",
    "piccolo-theme>=0.24.0",
    "pydata-sphinx-theme>=0.16.1",
    "pygments>=2.19.1",
    "sphinx-autoapi>=3.5.0",
    "sphinx-autodoc2>=0.5.0",
    "sphinx-automodapi>=0.18.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-math-dollar>=1.2.1",
    "sphinx-togglebutton>=0.3.2",
    "sphinx-typo3-theme>=4.9.0",
    "sphinx>=8.1.3",
]
linters = [
    "pre-commit>=4.1.0",
    "pylint>=3.3.4",
    "ruff>=0.9.6",
    "tach>=0.25.5",
]
tests = [
    "coverage>=7.6.12",
    "hypothesis[numpy,pandas,pytest]>=6.125.3",
    "psutil>=7.0.0",
    "pygal>=3.0.5",
    "pytest-benchmark[histogram]>=5.1.0",
    "pytest-cov>=6.0.0",
    "pytest-repeat>=0.9.3",
    "pytest-rerunfailures>=15.0",
    "pytest-xdist>=3.6.1",
    "pytest>=8.3.4",
]
typing = [
    "mypy>=1.15.0",
    "pyright>=1.1.394",
    "types-colorama>=0.4.15.20240311",
    "types-decorator>=5.1.8.20250121",
    "types-docutils>=0.21.0.20241128",
    "types-jsonschema>=4.23.0.20241208",
    "types-pillow>=10.2.0.20240822",
    "types-protobuf>=5.29.1.20250208",
    "types-psutil>=6.1.0.20241221",
    "types-pygments>=2.19.0.20250107",
    "types-pytz>=2025.1.0.20250204",
    "types-pyyaml>=6.0.12.20241230",
    "types-requests>=2.32.0.20241016",
    "types-setuptools>=75.8.0.20250210",
    "types-six>=1.17.0.20241205",
    "types-tabulate>=0.9.0.20241207",
    "types-tqdm>=4.67.0.20241221",
    "types-urllib3>=1.26.25.14",
    "typing-extensions>=4.12.2",
]
# endregion development dependencies ---------------------------------------------------


# region ruff configuration ------------------------------------------------------------
[tool.ruff]
src = ["src/", "tests/"]
indent-width = 4
line-length = 88
target-version = "py313"
output-format = "concise"

[tool.ruff.lint]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

#select = [
#    "A",     # flake8-builtins
#    "ANN",   # flake8-annotations
#    "ARG",   # flake8-unused-arguments
#    "B",     # bugbear
#    "C4",    # comprehensions
#    "C90",   # mccabe
#    "D",     # pydocstyle
#    "DOC",   # pydoclint
#    "E",     # pycodestyle
#    "EXE",   # executable
#    "F",     # pyflakes
#    "FBT",   # boolean-trap
#    "FURB",  # refurb
#    "I",     # isort
#    "ICN",   # import-conventions
#    "ISC",   # implicit-str-concat
#    "N",     # pep8-naming
#    "NPY",   # numpy
#    "N",     # naming
#    "PERF",  # performance related
#    "PGH",   # pygrep-hooks
#    "PIE",   # pie
#    "PL",    # pylint
#    "PT",    # pytest
#    # "PTH",   # path
#    "PYI",   # pyi
#    # "RET",   # return
#    "RUF",   # ruff specific
#    "S",     # flake8-bandit
#    "S101",  # use of `assert`
#    "SIM",   # simplify
#    "SLOT",  # slots
#    "TCH",   # type-checking
#    "TRY",   # tryceratops
#    "UP",    # pyupgrade
#    "W",     # warnings
#]
select=["ALL"]
ignore = [
    # flake8-builtins
    "A005",     # builtin-module-shadowing
    # annotations
    "ANN",      # missing-annotations
    # unused-arguments
    "ARG003",   # Unused class method argument
    # blind-except
    "BLE001",
    # mccabe
    "C90",      # too-complex
    # commas
    "COM",      # comma
    # copyright
    "CPY",      # missing-copyright
    # pydocstyle
    "D102",     # Missing docstring in public method
    "D103",     # Missing docstring in public function
    "D105",     # Missing docstring in magic method
    "D107",     # Missing docstring in __init__
    # pydoclint
    "DOC201",   # docstring-missing-returns
    "DOC501",   # docstring-missing-exception
    # datetime
    "DTZ",      # timezone-naive-datetime
    # pycodestyle
    "E201",     # Whitespace after '('
    "E202",     # Whitespace before ')'
    "E203",     # Whitespace before ':'
    "E221",     # Multiple spaces before operator
    # "E226",   # Missing whitespace around arithmetic operator
    # "E231",   # Missing whitespace after ','
    "E241",     # Multiple spaces after comma
    "E271",     # Multiple spaces after keyword
    "E272",     # Multiple spaces before keyword
    # error-messages
    "EM",       # error-messages
    # eradicate
    "ERA001",   # commented-out-code
    # fixme
    "FIX",      # fixme
    # refurb
    "FURB140",  # reimplemented-starmap (less efficient than comprehension)
    # naming
    "N801",     # class names should use CapWords convention
    "N806",     # variable in function should be lowercase
    "N812",     # lowercase imported as non-lowercase
    # pandas
    "PD002",    # pandas-use-of-inplace-argument
    "PD010",    # pandas-use-of-dot-pivot-or-unstack
    "PD011",    # pandas-use-of-dot-values
    "PD013",    # pandas-use-of-dot-stack
    "PD101",    # pandas-nunique-constant-series-check
    "PD901",    # Avoid using the generic variable name `df` for DataFrames
    # pylint
    "PLC2401",  # non-ascii-name
    "PLC2801",  # unnecessary-dunder-call
    "PLR0124",  # Name compared with itself
    "PLR2004",  # Magic value used in comparison
    "PLR6104",  # non-augmented-assignment
    "PLR6301",  # no-self-use
    # pylint "too-many-*" rules
    "PLR0904",  # Too many public methods
    "PLR0911",  # Too many return statements
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments in function definition
    "PLR0914",  # Too many local variables
    "PLR0915",  # Too many statements
    "PLR0916",  # Too many boolean expressions
    "PLR0917",  # Too many positional arguments
    # flake8-use-pathlib
    "PTH123",   # builtin-open
    # PYI
    "PYI051",   # redundant-literal-union
    # RET
    "RET504",   # unnecessary-assign
    # RUFF
    "RUF001",   # ambiguous-unicode-character-string
    "RUF002",   # ambiguous-unicode-character-docstring
    "RUF003",   # ambiguous-unicode-character-comment
    "RUF012",   # Mutable class attributes should be annotated with typing.ClassVar # FIXME: PEP 603
    "RUF013",   # PEP 484 prohibits implicit Optional
    "RUF022",   # __all__ not sorted
    # flake8-bandit
    "S301",     # suspicious-pickle-usage
    "S311",     # standard-random-usage
    "S403",     # suspicious-pickle-import
    "S404",     # suspicious-subprocess-import
    "S603",     # subprocess-without-shell-equals-true
    # type-check
    "TC006",    # Add quotes to type expression in `typing.cast()`
    # todo
    "TD",       # todo
    #
    "T201",     # `print` found
    # tryceratops
    "TRY003",   # Avoid specifying long messages outside the exception class
    # pyupgrade
    "UP007",    # Use `X | Y` for type annotations
]

[tool.ruff.lint.per-file-ignores]
"**/test*" = ["S101", "T20"]
"src/tsdm/linalg/*" = ["FBT001", "FBT002", "PLR6104"]
"src/tsdm/metrics/*" = ["PLR6301", "PLR6104"]
"src/tsdm/models/*" = ["N803"]
"src/tsdm/types/*" = ["ERA001"]

[tool.ruff.lint.pylint]
allow-dunder-method-names = ["__array__", "__array_ufunc__", "__dataframe__", "_repr_html_"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 120
max-line-length = 120

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
# endregion ruff configuration ---------------------------------------------------------


# region pylint configuration ----------------------------------------------------------
[tool.pylint]
[tool.pylint."MESSAGES CONTROL"]
enable = ["useless-suppression"]
disable = [
    "C0103",  # invalid-name  # Ridiculous...
    "C0144",  # non-ascii-name
    "C0204",  # bad-mcs-classmethod-argument
    "C0301",  # line-too-long
    "E0611",  # no-name-in-module
    "E1101",  # no-member  # FIXME: too many false positives
    "E1102",  # not-callable  # FIXME: too many false positives (torch)
    "E1121",  # too-many-function-args  # FIXME: too many false positives
    "E1123",  # unexpected-keyword-arg  # FIXME: too many false positives
    "E1130",  # invalid-unary-operand-type
    "E1139",  # invalid-metaclass  # FIXME: too many false positives
    "R0801",  # similar lines
    "R0902",  # too-many-instance-attributes
    "R0903",  # too-few-public-methods
    "R0911",  # too-many-return-statements
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "R0915",  # too-many-statements
    # "W0221",  # arguments-differ
    # "W0511",  # (fixme) (todos)
    "W1113",  # keyword-arg-before-vararg
    "W2301",  # unnecessary-ellipsis
]
fail-on = [
    "C0116",  # missing-function-docstring
]
fail-under = 9.0

[tool.pylint.REPORTS]
# Set the output format. Available formats are text, parseable, colorized, json and
# msvs (visual studio). You can also give a reporter class, e.g. mypackage.mymodule.MyReporterClass
output-format = "colorized"

[tool.pylint.FORMAT]
max-line-length = 120

[tool.pylint.TYPECHECK]
# List of members which are set dynamically and missed by pylint inference system, and so shouldn't
# trigger E1101 when accessed. Python regular expressions are accepted.
generated-members = ["numpy.*", "torch.*"]
# endregion pylint configuration -------------------------------------------------------


# region mypy configuration ------------------------------------------------------------
[tool.mypy]
files = ["src/", "tests/"]
platform = "linux"
plugins = []
python_version = "3.13"

disable_error_code = [
    "func-returns-value", # SEE: https://github.com/python/mypy/issues/6549
    "method-assign",      # SEE: https://github.com/python/mypy/issues/2427#issuecomment-1419206807
    "no-overload-impl",   # SEE: https://github.com/python/mypy/issues/17618
    # "overload-overlap",   # SEE: https://mypy.readthedocs.io/en/stable/more_types.html#type-checking-the-variants
]

# warnings
warn_no_return = true
warn_redundant_casts = true
warn_return_any = false
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

# disallow dynamic typing
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = false
disallow_subclassing_any = false

# untyped definitions
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = true

## strictness flags
#strict = false
#strict_equality = false
implicit_reexport = false
#enable_error_code =[]
#disable_error_code = []
allow_untyped_globals = false
allow_redefinition = false

## configuring error messages
color_output = true
error_summary = true
hide_error_codes = false
pretty = false
show_absolute_path = false
show_column_numbers = true
show_error_code_links = false
show_error_context = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "pyarrow.*",
    "pytest_benchmark.*",
    "scipy.*",
    "sklearn.*",
]
ignore_missing_imports = true
# endregion mypy configuration ---------------------------------------------------------


# region pyright configuration ---------------------------------------------------------
[tool.pyright]
venv = ".venv"
venvPath = "."
pythonVersion = "3.13"
pythonPlatform = "Linux"
include = ["src/", "tests/"]
typeCheckingMode = "standard"
useLibraryCodeForTypes = false  # `pandas` has way too many false positives

## Type Check Diagnostics Settings
# SEE: https://github.com/microsoft/pyright/blob/main/docs/configuration.md#type-check-diagnostics-settings
reportUnnecessaryTypeIgnoreComment = false

# strict mode flags we enable by default
reportUntypedClassDecorator = true
reportUnusedVariable = true
reportMatchNotExhaustive = true
reportUnnecessaryCast = true
#reportUnnecessaryComparison = true
reportUnnecessaryContains = true
#reportUnnecessaryIsInstance = true
#reportUnusedClass = true
#reportUnusedImport = true
#reportUnusedFunction = true
#reportUnusedVariable = true

# Disable these when running in strict mode
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportMissingTypeArgument = false
reportUnknownParameterType = false
reportMissingTypeStubs = false
reportConstantRedefinition = false  # we use uppercase for matrices/tensors.
# endregion pyright configuration ------------------------------------------------------


# region pytest configuration ----------------------------------------------------------
[tool.pytest]
# NOTE: currently unused https://docs.pytest.org/en/stable/reference/customize.html

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["src/", "tests/"]
addopts = [
    "--doctest-modules",
    # "--junit-xml=reports/pytest.xml",
    # ## xdists options
    "--numprocesses=0",  # number of parallel processes
    # ## rerunfailures options
    #    "--reruns=",          # number of times to re-run failed tests (default 0)
    #    "--reruns-delay=",    # add time (seconds) delay between reruns.
    #    "--only-rerun=",      # If passed, only rerun errors matching the regex provided.
    # ## coverage options
    "--cov=tsdm",
    "--cov-report=term:skip-covered",
    "--cov-report=xml:reports/coverage.xml",
    #    "--cov-report=annotate:reports/coverage",
    # benchmark options
    "--benchmark-group-by=func",
    "--benchmark-sort=mean",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "serial",
]
required_plugins = [
    "pytest-benchmark",
    "pytest-cov",
    "pytest-repeat",
    "pytest-rerunfailures",
    "pytest-xdist",
]
# endregion pytest configuration -------------------------------------------------------
