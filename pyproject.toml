[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

# region project configuration ---------------------------------------------------------
[project]
authors = [{ name = "Randolf Scholz", email = "randolf.scholz@gmail.com" }]
name = "tsdm"
version = "0.8.1"
description = "Time-Series Datasets and Models"
readme = "README.md"
license-files = ["LICENSE"]
urls = { repository = "https://github.com/randolf-scholz/tsdm.git" }
import-names = ["tsdm", "numerical_types"]

# meta-information
keywords = ["time-series", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Environment :: GPU :: NVIDIA CUDA",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx2>=2.9.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "polars>=1.43.2",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4", # removal candidate
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "tensorboard>=2.21.0",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "typing-extensions>=4.16.0",
]
# endregion project configuration ------------------------------------------------------


# region development dependencies ------------------------------------------------------
[dependency-groups]
dev = [
    { include-group = "debug" },
    { include-group = "devtools" },
    { include-group = "docs" },
    { include-group = "linters" },
    { include-group = "tests" },
    { include-group = "typing" },
]
devtools = [
    "cmake>=4.4.2",
    "ninja>=1.13.0",
    "prek>=0.4.12",
    "pybadges>=3.0.1",
]
debug = [
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.8",
    "jupyterlab-execute-time>=3.3.0",
    "jupyterlab>=4.6.2",
    "psutil>=7.2.2",
]
docs = [
    "docutils>=0.22.4",
    "myst-parser>=5.1.0",
    "nbsphinx>=0.9.8",
    "piccolo-theme>=0.24.0",
    "pydata-sphinx-theme>=0.20.0",
    "pygments>=2.20.0",
    "sphinx-autoapi>=3.8.0",
    "sphinx-autodoc2>=0.5.0",
    "sphinx-automodapi>=0.22.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-math-dollar>=1.3",
    "sphinx-togglebutton>=0.4.5",
    "sphinx-typo3-theme>=4.9.0",
    "sphinx>=9.1.0",
]
linters = [
    "prek>=0.4.12",
    "ruff>=0.16.2",
    "tach>=0.35.0",
]
tests = [
    "coverage>=7.15.4",
    "hypothesis[numpy,pandas,pytest]>=6.165.2",
    "psutil>=7.2.2",
    "pygal>=3.1.3",
    "pytest-benchmark[histogram]>=5.2.3",
    "pytest-cov>=7.1.0",
    "pytest-repeat>=0.9.4",
    "pytest-rerunfailures>=16.4",
    "pytest-xdist>=3.8.0",
    "pytest>=9.1.1",
]
typing = [
    "mypy>=2.3.0",
    "pyrefly>=1.2.0",
    "pyright>=1.1.411",
    "scipy-stubs>=1.18.0.1",
    "ty>=0.0.69",
    "types-colorama>=0.4.15.20260508",
    "types-defusedxml>=0.7.0.20260504",
    "types-gevent>=26.7.0.20260807",
    "types-jsonschema>=4.26.0.20260518",
    "types-networkx>=3.6.1.20260728",
    "types-pexpect>=4.9.0.20260518",
    "types-protobuf>=7.34.1.20260518",
    "types-pygments>=2.20.0.20260728",
    "types-pytz>=2026.3.1.20260727",
    "types-pyyaml>=6.0.12.20260724",
    "types-setuptools>=83.0.0.20260807",
    "types-tabulate>=0.10.0.20260508",
    "types-tqdm>=4.70.0.20260805",
    "typing-extensions>=4.16.0",
]
# endregion development dependencies ---------------------------------------------------

[tool.tach]
forbid_circular_dependencies = true
exact = true

[tool.tombi]
[tool.tombi.format.rules]
indent-width = 4

# region ruff configuration ------------------------------------------------------------
[tool.ruff]
src = ["src/", "tests/"]
indent-width = 4
line-length = 88
target-version = "py314"
output-format = "concise"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.per-file-ignores]
"src/tsdm/linalg/*" = ["FBT001", "FBT002", "PLR6104"]
"src/tsdm/metrics/*" = ["PLR6301", "PLR6104"]
"src/tsdm/models/*" = ["N803"]
"src/tsdm/types/*" = ["ERA001"]
"**/test*" = [
    "D100",
    "D101",
    "D104",
    "D106",
    "PYI042",
    "RUF046",
    "S101",
    "SIM300",
    "T20",
    "UP018",
    "RUF046"
]

[tool.ruff.lint.pylint]
allow-dunder-method-names = [
    "__array__",
    "__array_ufunc__",
    "__dataframe__",
    "_repr_html_"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 120
max-line-length = 120
ignore-overlong-task-comments = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

#select = [
#    "A",     # flake8-builtins
#    "ANN",   # flake8-annotations
#    "ARG",   # flake8-unused-arguments
#    "B",     # bugbear
#    "C4",    # comprehensions
#    "C90",   # mccabe
#    "D",     # pydocstyle
#    "DOC",   # pydoclint
#    "E",     # pycodestyle
#    "EXE",   # executable
#    "F",     # pyflakes
#    "FBT",   # boolean-trap
#    "FURB",  # refurb
#    "I",     # isort
#    "ICN",   # import-conventions
#    "ISC",   # implicit-str-concat
#    "N",     # pep8-naming
#    "NPY",   # numpy
#    "N",     # naming
#    "PERF",  # performance related
#    "PGH",   # pygrep-hooks
#    "PIE",   # pie
#    "PL",    # pylint
#    "PT",    # pytest
#    # "PTH",   # path
#    "PYI",   # pyi
#    # "RET",   # return
#    "RUF",   # ruff specific
#    "S",     # flake8-bandit
#    "S101",  # use of `assert`
#    "SIM",   # simplify
#    "SLOT",  # slots
#    "TCH",   # type-checking
#    "TRY",   # tryceratops
#    "UP",    # pyupgrade
#    "W",     # warnings
#]
select = ["ALL"]
ignore = [
    # fully ignored:
    "ANN", # missing-annotations
    "C90", # too-complex
    "COM", # comma
    "CPY", # missing-copyright
    "DTZ", # timezone-naive-datetime
    "EM", # error-messages
    "ERA", # commented-out-code
    "FIX", # fixme
    "T20", # flake8-print
    "TD", # todo
    # partially ignored:
    # flake8-builtins
    "A005", # builtin-module-shadowing
    # unused-arguments
    "ARG003", # Unused class method argument
    # blind-except
    "BLE001",
    # pydocstyle
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in __init__
    # pydoclint
    "DOC201", # docstring-missing-returns
    "DOC402", # docstring-missing-yields
    "DOC501", # docstring-missing-exception
    # pycodestyle
    "E201", # Whitespace after '('
    "E202", # Whitespace before ')'
    "E203", # Whitespace before ':'
    "E221", # Multiple spaces before operator
    "E222", # Multiple spaces after operator
    "E741", # Ambiguous variable name (like l, O, or I)
    # "E226",   # Missing whitespace around arithmetic operator
    # "E231",   # Missing whitespace after ','
    "E241", # Multiple spaces after comma
    "E271", # Multiple spaces after keyword
    "E272", # Multiple spaces before keyword
    # refurb
    "FURB140", # reimplemented-starmap (less efficient than comprehension)
    #
    "G004", # logging f-string
    # naming
    "N801", # class names should use CapWords convention
    "N803", # argument name should be lowercase
    "N806", # variable in function should be lowercase
    "N812", # lowercase imported as non-lowercase
    "N817", # camelcase imported as acronym
    # pandas
    "PD002", # pandas-use-of-inplace-argument
    "PD010", # pandas-use-of-dot-pivot-or-unstack
    "PD011", # pandas-use-of-dot-values
    "PD013", # pandas-use-of-dot-stack
    "PD101", # pandas-nunique-constant-series-check
    # pygrep-hooks
    "PGH003", # blanket-type-ignore
    # pylint
    "PLC2401", # non-ascii-name
    "PLC2801", # unnecessary-dunder-call
    "PLR0124", # Name compared with itself
    "PLR2004", # Magic value used in comparison
    "PLR6104", # non-augmented-assignment
    "PLR6301", # no-self-use
    # pylint-refactor
    "PLR0904", # Too many public methods
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments in function definition
    "PLR0914", # Too many local variables
    "PLR0915", # Too many statements
    "PLR0916", # Too many boolean expressions
    "PLR0917", # Too many positional arguments
    # pylint warning rules
    "PLW1641", # eq-without-hash
    # flake8-use-pathlib
    "PTH123", # builtin-open
    # RET
    "RET504", # unnecessary-assign
    # RUFF
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
    "RUF012", # Mutable class attributes should be annotated with typing.ClassVar # FIXME: PEP 603
    "RUF013", # PEP 484 prohibits implicit Optional
    "RUF022", # __all__ not sorted
    "RUF036", # None not at the end of type annotation
    # flake8-bandit
    "S101", # assert statement
    "S301", # suspicious-pickle-usage
    "S311", # standard-random-usage
    "S403", # suspicious-pickle-import
    "S404", # suspicious-subprocess-import
    "S603", # subprocess-without-shell-equals-true
    # type-checking
    "TC001", # Move application library import into a type-checking block
    "TC002", # Move third-party library import into a type-checking block
    "TC003", # Move standard library import into a type-checking block
    # tryceratops
    "TRY003", # Avoid specifying long messages outside the exception class
    # pyupgrade
    "UP045", # Use `X | Y` for type annotations
]
# endregion ruff configuration ---------------------------------------------------------

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.ty]
[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
output-format = "concise"

[tool.ty.analysis]
respect-type-ignore-comments = true
replace-imports-with-any = [
    "pyarrow.*", ]
allowed-unresolved-imports = ["pyarrow.compute.*", ]

# region pyrefly configuration ---------------------------------------------------------
[tool.pyrefly]
python-version = "3.14"
output-format = "min-text"
search-path = ["src/", "."]
replace_imports_with_any = [
    "pandas.*",
    "pyarrow.*",
    "pytest_benchmark.*",
    "sklearn.*",
]

[tool.pyrefly.errors]
invalid-overload = false
unused-ignore = true
# endregion pyrefly configuration ------------------------------------------------------


# region mypy configuration ------------------------------------------------------------
[tool.mypy]
# SEE: https://mypy.readthedocs.io/en/stable/config_file.html
follow_imports = "silent"
files = ["src/", "tests/"]
platform = "linux"
plugins = []
python_version = "3.14"
disable_error_code = [
    "func-returns-value", # SEE: https://github.com/python/mypy/issues/6549
    "method-assign", # SEE: https://github.com/python/mypy/issues/2427#issuecomment-1419206807
    "no-overload-impl", # SEE: https://github.com/python/mypy/issues/17618
    # "overload-overlap",   # SEE: https://mypy.readthedocs.io/en/stable/more_types.html#type-checking-the-variants
    "no-untyped-def", # using ruff for this instead.
    "var-annotated", # prevents gradual typing.
]

# warnings
warn_no_return = true
warn_redundant_casts = true
warn_return_any = false
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

# disallow dynamic typing
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = false
disallow_subclassing_any = false

# untyped definitions
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = true

# strictness flags
# strict = false
# strict_equality = false
implicit_reexport = false
# enable_error_code =[]
# disable_error_code = []
allow_untyped_globals = false
allow_redefinition_new = true
local_partial_types = true

# configuring error messages
color_output = true
error_summary = true
hide_error_codes = false
pretty = false
show_absolute_path = false
show_column_numbers = true
show_error_code_links = false
show_error_context = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "pyarrow.*",
    "pytest_benchmark.*",
    "sklearn.*",
]
ignore_missing_imports = true
# endregion mypy configuration ---------------------------------------------------------


# region pyright configuration ---------------------------------------------------------
[tool.pyright]
# SEE: https://microsoft.github.io/pyright/#/configuration

# Environment Options
include = ["src/", "tests/"]
exclude = []
strict = []
# extends = ""
defineConstant = { "__debug__" = true }
# typeshedPath = ""
# stubPath = ""
venvPath = ".venv"
# venv = ".venv"
pythonVersion = "3.14"
pythonPlatform = "Linux"
# executionEnvironments = []
useLibraryCodeForTypes = false  # pandas and pyarrow lack proper type hints

# Type Check Diagnostics Settings
typeCheckingMode = "standard"  # "off", "basic", "strict", "standard"
ignore = []

# Type Evaluation Settings
strictListInference = false
strictDictionaryInference = false
strictSetInference = false
analyzeUnannotatedFunctions = true
strictParameterNoneValue = true
enableTypeIgnoreComments = true  # disable `# type: ignore` comments (use `# pyright: ignore` instead)
deprecateTypingAliases = true  # deprecate `typing` aliases like `List`, `Dict`, etc.
enableReachabilityAnalysis = true
enableExperimentalFeatures = false
disableBytesTypePromotions = true

# Type Check Rule Overrides
# reportAbstractUsage = "error"  # default: "error"
# reportArgumentType = "error"  # default: "error"
# reportAssertAlwaysTrue = "warning"  # default: "warning"
# reportAssertTypeFailure = "error"  # default: "error"
# reportAssignmentType = "error"  # default: "error"
# reportAttributeAccessIssue = "error"  # default: "error"
# reportCallInDefaultInitializer = "none"  # default: "none"
# reportCallIssue = "error"  # default: "error"
# reportConstantRedefinition = "none"  # default: "none"
# reportDeprecated = "none"  # default: "none"
reportDuplicateImport = "error"  # default: "none"
# reportFunctionMemberAccess = "error"  # default: "error"
# reportGeneralTypeIssues = "error"  # default: "error"
# reportImplicitOverride = "none"  # default: "none"
# reportImplicitStringConcatenation = "none"  # default: "none"
# reportImportCycles = "error"  # default: "none"
# reportIncompatibleMethodOverride = "error"  # default: "error"
# reportIncompatibleVariableOverride = "error"  # default: "error"
# reportIncompleteStub = "none"  # default: "none"
# reportInconsistentConstructor = "none"  # default: "none"
# reportInconsistentOverload = "error"  # default: "error"
# reportIndexIssue = "error"  # default: "error"
# reportInvalidStringEscapeSequence = "warning"  # default: "warning"
# reportInvalidStubStatement = "none"  # default: "none"
# reportInvalidTypeArguments = "error"  # default: "error"
# reportInvalidTypeForm = "error"  # default: "error"
# reportInvalidTypeVarUse = "warning"  # default: "warning"
reportMatchNotExhaustive = "error"  # default: "none"
# reportMissingImports = "error"  # default: "error"
# reportMissingModuleSource = "warning"  # default: "warning"
# reportMissingParameterType = "none"  # default: "none"
# reportMissingSuperCall = "none"  # default: "none"
# reportMissingTypeArgument = "none"  # default: "none"
# reportMissingTypeStubs = "none"  # default: "none"
reportNoOverloadImplementation = "none"  # default: "error"
# reportOperatorIssue = "error"  # default: "error"
# reportOptionalCall = "error"  # default: "error"
# reportOptionalContextManager = "error"  # default: "error"
# reportOptionalIterable = "error"  # default: "error"
# reportOptionalMemberAccess = "error"  # default: "error"
# reportOptionalOperand = "error"  # default: "error"
# reportOptionalSubscript = "error"  # default: "error"
# reportOverlappingOverload = "error"  # default: "error"
# reportPossiblyUnboundVariable = "error"  # default: "error"
reportPrivateImportUsage = "none"  # default: "error"
# reportPrivateUsage = "none"  # default: "none"
# reportPropertyTypeMismatch = "none"  # default: "none"
# reportRedeclaration = "error"  # default: "error"
# reportReturnType = "error"  # default: "error"
# reportSelfClsParameterName = "warning"  # default: "warning"
# reportShadowedImports = "none"  # default: "none"
# reportTypeCommentUsage = "none"  # default: "none"
# reportTypedDictNotRequiredAccess = "error"  # default: "error"
# reportUnboundVariable = "error"  # default: "error"
# reportUndefinedVariable = "error"  # default: "error"
# reportUnhashable = "error"  # default: "error"
# reportUninitializedInstanceVariable = "none"  # default: "none"
# reportUnknownArgumentType = "none"  # default: "none"
# reportUnknownLambdaType = "none"  # default: "none"
# reportUnknownMemberType = "none"  # default: "none"
# reportUnknownParameterType = "none"  # default: "none"
# reportUnknownVariableType = "none"  # default: "none"
reportUnnecessaryCast = "error"  # default: "none"
# reportUnnecessaryComparison = "none"  # default: "none"
# reportUnnecessaryContains = "none"  # default: "none"
# reportUnnecessaryIsInstance = "none"  # default: "none"
reportUnnecessaryTypeIgnoreComment = "error"  # default: "none"
# reportUnreachable = "none"  # default: "none"
# reportUnsupportedDunderAll = "warning"  # default: "warning"
reportUntypedBaseClass = "error"  # default: "none"
#reportUntypedClassDecorator = "none"  # default: "none"
#reportUntypedFunctionDecorator = "none"  # default: "none"
reportUntypedNamedTuple = "error"  # default: "none"
# reportUnusedCallResult = "none"  # default: "none"
reportUnusedClass = "error"  # default: "none"
# reportUnusedCoroutine = "error"  # default: "error"
# reportUnusedExcept = "error"  # default: "error"
# reportUnusedExpression = "none"  # default: "none"
# reportUnusedFunction = "none"  # default: "none"
reportUnusedImport = "error"  # default: "none"
reportUnusedVariable = "error"  # default: "none"
reportWildcardImportFromLibrary = "error"  # default: "warning"
# endregion pyright configuration ------------------------------------------------------


# region pytest configuration ----------------------------------------------------------
[tool.pytest]
minversion = "9.0.2"
pythonpath = ["src"]
testpaths = ["src/", "tests/"]
xfail_strict = true
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "serial",
    "interactive",
    "flaky: mark tests that may be retried when pytest-rerunfailures is installed",
]
required_plugins = [
    "pytest-benchmark",
    "pytest-cov",
    "pytest-repeat",
    "pytest-rerunfailures",
    "pytest-xdist",
]
addopts = [
    "-p", "no:tach", # FIXME: https://github.com/tach-org/tach/issues/903
    "--doctest-modules",
    # "--junit-xml=.reports/pytest.xml",
    # rerunfailures options
    #    "--reruns=",          # number of times to re-run failed tests (default 0)
    #    "--reruns-delay=",    # add time (seconds) delay between reruns.
    #    "--only-rerun=",      # If passed, only rerun errors matching the regex provided.
    # xdists options
    "--numprocesses=0", # number of parallel processes
    "--dist=loadfile", # distribute tests by scope (module or class)
    # coverage options
    #    "--cov=tsdm",
    #    "--cov-report=term:skip-covered",
    #    "--cov-report=xml:.reports/coverage.xml",
    #    "--cov-report=annotate:.reports/coverage",
    # benchmark options
    "--benchmark-group-by=group",
    "--benchmark-autosave",
    "--benchmark-compare",
    "--benchmark-sort=mean",
]
# endregion pytest configuration -------------------------------------------------------
