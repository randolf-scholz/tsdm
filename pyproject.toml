[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

# region project configuration ---------------------------------------------------------
[project]
requires-python = ">=3.13,<3.15"
name = "tsdm"
version = "0.7.0"
authors = [{ name = "Randolf Scholz", email = "randolf.scholz@gmail.com" }]
description = "Time-Series Datasets and Models"

# package content
license = { file = "LICENSE" }
readme = "README.md"

# meta-information
keywords = ["time-series", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 12.8",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "pillow>=12.0.0",
    "polars>=1.35.2",
    "pyarrow>=22.0.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "tensorboard>=2.20.0",
    "torch>=2.9.1",
    "tqdm>=4.67.1",
    "typing-extensions>=4.15.0",
]

[project.urls]
repository = "https://github.com/randolf-scholz/tsdm.git"
# endregion project configuration ------------------------------------------------------


# region development dependencies ------------------------------------------------------
[dependency-groups]
dev = [
    {include-group="devtools"}, {include-group="docs"}, {include-group="debug"},
    {include-group="linters"}, {include-group="tests"}, {include-group="typing"},
]
devtools = [
    "cmake>=4.2.0",
    "ninja>=1.13.0",
    "pybadges>=3.0.1",
]
debug = [
    "ipympl>=0.9.8",
    "ipywidgets>=8.1.8",
    "jupyterlab-execute-time>=3.2.0",
    "jupyterlab>=4.5.0",
    "psutil>=7.1.3",
    "torchinfo>=1.8.0",
]
docs = [
    "docutils>=0.21.2",
    "myst-parser>=4.0.1",
    "nbsphinx>=0.9.8",
    "piccolo-theme>=0.24.0",
    "pydata-sphinx-theme>=0.16.1",
    "pygments>=2.19.2",
    "sphinx-autoapi>=3.6.0",
    "sphinx-autodoc2>=0.5.0",
    "sphinx-automodapi>=0.20.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-math-dollar>=1.2.1",
    "sphinx-togglebutton>=0.3.2",
    "sphinx-typo3-theme>=4.9.0",
    "sphinx>=8.2.3",
]
linters = [
    "pre-commit>=4.5.0",
    "pylint>=3.3.9",
    "ruff>=0.14.6",
    "tach>=0.32.1",
]
tests = [
    "coverage>=7.12.0",
    "hypothesis[numpy,pandas,pytest]>=6.148.3",
    "psutil>=7.1.3",
    "pygal>=3.0.5",
    "pytest-benchmark[histogram]>=5.2.3",
    "pytest-cov>=7.0.0",
    "pytest-repeat>=0.9.4",
    "pytest-rerunfailures>=16.1",
    "pytest-xdist>=3.8.0",
    "pytest>=9.0.1",
]
typing = [
    "mypy>=1.19.0",
    "pyarrow-stubs>=20.0.0.20251107",
    "pyrefly>=0.43.1",
    "pyright>=1.1.407",
    "scipy-stubs>=1.16.3.1",
    "types-colorama>=0.4.15.20250801",
    "types-decorator>=5.2.0.20251101",
    "types-docutils>=0.22.3.20251115",
    "types-jsonschema>=4.25.1.20251009",
    "types-pillow>=10.2.0.20240822",
    "types-protobuf>=6.32.1.20251105",
    "types-psutil>=7.1.3.20251128",
    "types-pygments>=2.19.0.20251121",
    "types-pytz>=2025.2.0.20251108",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.32.4.20250913",
    "types-setuptools>=80.9.0.20250822",
    "types-six>=1.17.0.20251009",
    "types-tabulate>=0.9.0.20241207",
    "types-tqdm>=4.67.0.20250809",
    "types-urllib3>=1.26.25.14",
    "typing-extensions>=4.15.0",
]
# endregion development dependencies ---------------------------------------------------


# region ruff configuration ------------------------------------------------------------
[tool.ruff]
src = ["src/", "tests/"]
indent-width = 4
line-length = 88
target-version = "py313"
output-format = "concise"

[tool.ruff.lint]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

#select = [
#    "A",     # flake8-builtins
#    "ANN",   # flake8-annotations
#    "ARG",   # flake8-unused-arguments
#    "B",     # bugbear
#    "C4",    # comprehensions
#    "C90",   # mccabe
#    "D",     # pydocstyle
#    "DOC",   # pydoclint
#    "E",     # pycodestyle
#    "EXE",   # executable
#    "F",     # pyflakes
#    "FBT",   # boolean-trap
#    "FURB",  # refurb
#    "I",     # isort
#    "ICN",   # import-conventions
#    "ISC",   # implicit-str-concat
#    "N",     # pep8-naming
#    "NPY",   # numpy
#    "N",     # naming
#    "PERF",  # performance related
#    "PGH",   # pygrep-hooks
#    "PIE",   # pie
#    "PL",    # pylint
#    "PT",    # pytest
#    # "PTH",   # path
#    "PYI",   # pyi
#    # "RET",   # return
#    "RUF",   # ruff specific
#    "S",     # flake8-bandit
#    "S101",  # use of `assert`
#    "SIM",   # simplify
#    "SLOT",  # slots
#    "TCH",   # type-checking
#    "TRY",   # tryceratops
#    "UP",    # pyupgrade
#    "W",     # warnings
#]
select=["ALL"]
ignore = [
    # fully ignored:
    "ANN",      # missing-annotations
    "C90",      # too-complex
    "COM",      # comma
    "CPY",      # missing-copyright
    "DTZ",      # timezone-naive-datetime
    "EM",       # error-messages
    "ERA",      # commented-out-code
    "FIX",      # fixme
    "T20",      # flake8-print
    "TD",       # todo
    # partially ignored:
    # flake8-builtins
    "A005",     # builtin-module-shadowing
    # unused-arguments
    "ARG003",   # Unused class method argument
    # blind-except
    "BLE001",
    # pydocstyle
    "D102",     # Missing docstring in public method
    "D103",     # Missing docstring in public function
    "D105",     # Missing docstring in magic method
    "D107",     # Missing docstring in __init__
    # pydoclint
    "DOC201",   # docstring-missing-returns
    "DOC402",   # docstring-missing-yields
    "DOC501",   # docstring-missing-exception
    # pycodestyle
    "E201",     # Whitespace after '('
    "E202",     # Whitespace before ')'
    "E203",     # Whitespace before ':'
    "E221",     # Multiple spaces before operator
    "E741",     # Ambiguous variable name (like l, O, or I)
    # "E226",   # Missing whitespace around arithmetic operator
    # "E231",   # Missing whitespace after ','
    "E241",     # Multiple spaces after comma
    "E271",     # Multiple spaces after keyword
    "E272",     # Multiple spaces before keyword
    # refurb
    "FURB140",  # reimplemented-starmap (less efficient than comprehension)
    # naming
    "N801",     # class names should use CapWords convention
    "N803",     # argument name should be lowercase
    "N806",     # variable in function should be lowercase
    "N812",     # lowercase imported as non-lowercase
    # pandas
    "PD002",    # pandas-use-of-inplace-argument
    "PD010",    # pandas-use-of-dot-pivot-or-unstack
    "PD011",    # pandas-use-of-dot-values
    "PD013",    # pandas-use-of-dot-stack
    "PD101",    # pandas-nunique-constant-series-check
    # pylint
    "PLC2401",  # non-ascii-name
    "PLC2801",  # unnecessary-dunder-call
    "PLR0124",  # Name compared with itself
    "PLR2004",  # Magic value used in comparison
    "PLR6104",  # non-augmented-assignment
    "PLR6301",  # no-self-use
    # pylint "too-many-*" rules
    "PLR0904",  # Too many public methods
    "PLR0911",  # Too many return statements
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments in function definition
    "PLR0914",  # Too many local variables
    "PLR0915",  # Too many statements
    "PLR0916",  # Too many boolean expressions
    "PLR0917",  # Too many positional arguments
    # flake8-use-pathlib
    "PTH123",   # builtin-open
    # RET
    "RET504",   # unnecessary-assign
    # RUFF
    "RUF001",   # ambiguous-unicode-character-string
    "RUF002",   # ambiguous-unicode-character-docstring
    "RUF003",   # ambiguous-unicode-character-comment
    "RUF012",   # Mutable class attributes should be annotated with typing.ClassVar # FIXME: PEP 603
    "RUF013",   # PEP 484 prohibits implicit Optional
    "RUF022",   # __all__ not sorted
    "RUF036",   # None not at the end of type annotation
    # flake8-bandit
    "S101",     # assert statement
    "S301",     # suspicious-pickle-usage
    "S311",     # standard-random-usage
    "S403",     # suspicious-pickle-import
    "S404",     # suspicious-subprocess-import
    "S603",     # subprocess-without-shell-equals-true
    # type-checking
    "TC001",    # Move application library import into a type-checking block
    "TC002",    # Move third-party library import into a type-checking block
    "TC003",    # Move standard library import into a type-checking block
    # tryceratops
    "TRY003",   # Avoid specifying long messages outside the exception class
    # pyupgrade
    "UP045",    # Use `X | Y` for type annotations
]

[tool.ruff.lint.per-file-ignores]
"**/test*" = ["D101", "S101", "SIM300", "T20", "UP018", "RUF046"]
"src/tsdm/linalg/*" = ["FBT001", "FBT002", "PLR6104"]
"src/tsdm/metrics/*" = ["PLR6301", "PLR6104"]
"src/tsdm/models/*" = ["N803"]
"src/tsdm/types/*" = ["ERA001"]

[tool.ruff.lint.pylint]
allow-dunder-method-names = ["__array__", "__array_ufunc__", "__dataframe__", "_repr_html_"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 120
max-line-length = 120

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
# endregion ruff configuration ---------------------------------------------------------


[tool.ty.environment]
python-version = "3.13"


[tool.ty.terminal]
output-format = "concise"

[tool.pyrefly]
python_version = "3.13"


# region pylint configuration ----------------------------------------------------------
[tool.pylint]
[tool.pylint."MESSAGES CONTROL"]
enable = ["useless-suppression"]
disable = [
    "C0103",  # invalid-name  # Ridiculous...
    "C0144",  # non-ascii-name
    "C0204",  # bad-mcs-classmethod-argument
    "C0301",  # line-too-long
    # "E0611",  # no-name-in-module
    "E1101",  # no-member  # FIXME: too many false positives
    "E1102",  # not-callable  # FIXME: too many false positives (torch)
    "E1121",  # too-many-function-args  # FIXME: too many false positives
    "E1123",  # unexpected-keyword-arg  # FIXME: too many false positives
    "E1130",  # invalid-unary-operand-type
    "E1139",  # invalid-metaclass  # FIXME: too many false positives
    "R0801",  # similar lines
    "R0902",  # too-many-instance-attributes
    "R0903",  # too-few-public-methods
    "R0911",  # too-many-return-statements
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "R0915",  # too-many-statements
    # "W0221",  # arguments-differ
    # "W0511",  # (fixme) (todos)
    "W1113",  # keyword-arg-before-vararg
    "W2301",  # unnecessary-ellipsis
]
fail-on = [
    "C0116",  # missing-function-docstring
]
fail-under = 9.0

[tool.pylint.REPORTS]
# Set the output format. Available formats are text, parseable, colorized, JSON and
# msvs (Visual Studio). You can also give a reporter class, e.g. mypackage.mymodule.MyReporterClass
output-format = "colorized"

[tool.pylint.FORMAT]
max-line-length = 120

[tool.pylint.TYPECHECK]
# List of members which are set dynamically and missed by pylint inference system, and so shouldn't
# trigger E1101 when accessed. Python regular expressions are accepted.
generated-members = ["numpy.*", "torch.*"]
# endregion pylint configuration -------------------------------------------------------


# region mypy configuration ------------------------------------------------------------
[tool.mypy]
# SEE: https://mypy.readthedocs.io/en/stable/config_file.html
follow_imports = "silent"
files = ["src/", "tests/"]
platform = "linux"
plugins = []
python_version = "3.13"
exclude = ["test_json_types.py"]  # FIXME: https://github.com/python/mypy/issues/20135

disable_error_code = [
    "func-returns-value", # SEE: https://github.com/python/mypy/issues/6549
    "method-assign",      # SEE: https://github.com/python/mypy/issues/2427#issuecomment-1419206807
    "no-overload-impl",   # SEE: https://github.com/python/mypy/issues/17618
    # "overload-overlap",   # SEE: https://mypy.readthedocs.io/en/stable/more_types.html#type-checking-the-variants
]

# warnings
warn_no_return = true
warn_redundant_casts = true
warn_return_any = false
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

# disallow dynamic typing
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = false
disallow_subclassing_any = false

# untyped definitions
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = true

# strictness flags
#strict = false
#strict_equality = false
implicit_reexport = false
#enable_error_code =[]
#disable_error_code = []
allow_untyped_globals = false
allow_redefinition = false

# configuring error messages
color_output = true
error_summary = true
hide_error_codes = false
pretty = false
show_absolute_path = false
show_column_numbers = true
show_error_code_links = false
show_error_context = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "pytest_benchmark.*",
    "sklearn.*",
]
ignore_missing_imports = true
# endregion mypy configuration ---------------------------------------------------------


# region pyright configuration ---------------------------------------------------------
[tool.pyright]
# SEE: https://microsoft.github.io/pyright/#/configuration

# Environment Options
include = ["src/", "tests/"]
exclude = []
strict = []
#extends = ""
defineConstant = {"__debug__" = true}
#typeshedPath = ""
#stubPath = ""
venvPath = ".venv"
#venv = ".venv"
pythonVersion = "3.13"
pythonPlatform = "Linux"
#executionEnvironments = []
useLibraryCodeForTypes = false  # `pandas` has way too many false positives

# Type Check Diagnostics Settings
typeCheckingMode = "standard"  # "off", "basic", "strict", "standard"
ignore = []

# Type Evaluation Settings
strictListInference = false
strictDictionaryInference = false
strictSetInference = false
analyzeUnannotatedFunctions = true
strictParameterNoneValue = true
enableTypeIgnoreComments = false  # disable `# type: ignore` comments (use `# pyright: ignore` instead)
deprecateTypingAliases = true  # deprecate `typing` aliases like `List`, `Dict`, etc.
enableReachabilityAnalysis = true
enableExperimentalFeatures = false
disableBytesTypePromotions = true

# Type Check Rule Overrides
#reportAbstractUsage = "error"  # default: "error"
#reportArgumentType = "error"  # default: "error"
#reportAssertAlwaysTrue = "warning"  # default: "warning"
#reportAssertTypeFailure = "error"  # default: "error"
#reportAssignmentType = "error"  # default: "error"
#reportAttributeAccessIssue = "error"  # default: "error"
#reportCallInDefaultInitializer = "none"  # default: "none"
#reportCallIssue = "error"  # default: "error"
#reportConstantRedefinition = "none"  # default: "none"
#reportDeprecated = "none"  # default: "none"
reportDuplicateImport = "error"  # default: "none"
#reportFunctionMemberAccess = "error"  # default: "error"
#reportGeneralTypeIssues = "error"  # default: "error"
#reportImplicitOverride = "none"  # default: "none"
#reportImplicitStringConcatenation = "none"  # default: "none"
reportImportCycles = "error"  # default: "none"
#reportIncompatibleMethodOverride = "error"  # default: "error"
#reportIncompatibleVariableOverride = "error"  # default: "error"
#reportIncompleteStub = "none"  # default: "none"
#reportInconsistentConstructor = "none"  # default: "none"
#reportInconsistentOverload = "error"  # default: "error"
#reportIndexIssue = "error"  # default: "error"
#reportInvalidStringEscapeSequence = "warning"  # default: "warning"
#reportInvalidStubStatement = "none"  # default: "none"
#reportInvalidTypeArguments = "error"  # default: "error"
#reportInvalidTypeForm = "error"  # default: "error"
#reportInvalidTypeVarUse = "warning"  # default: "warning"
reportMatchNotExhaustive = "error"  # default: "none"
#reportMissingImports = "error"  # default: "error"
#reportMissingModuleSource = "warning"  # default: "warning"
#reportMissingParameterType = "none"  # default: "none"
#reportMissingSuperCall = "none"  # default: "none"
#reportMissingTypeArgument = "none"  # default: "none"
#reportMissingTypeStubs = "none"  # default: "none"
reportNoOverloadImplementation = "none"  # default: "error"
#reportOperatorIssue = "error"  # default: "error"
#reportOptionalCall = "error"  # default: "error"
#reportOptionalContextManager = "error"  # default: "error"
#reportOptionalIterable = "error"  # default: "error"
#reportOptionalMemberAccess = "error"  # default: "error"
#reportOptionalOperand = "error"  # default: "error"
#reportOptionalSubscript = "error"  # default: "error"
#reportOverlappingOverload = "error"  # default: "error"
#reportPossiblyUnboundVariable = "error"  # default: "error"
#reportPrivateImportUsage = "error"  # default: "error"
#reportPrivateUsage = "none"  # default: "none"
#reportPropertyTypeMismatch = "none"  # default: "none"
#reportRedeclaration = "error"  # default: "error"
#reportReturnType = "error"  # default: "error"
#reportSelfClsParameterName = "warning"  # default: "warning"
#reportShadowedImports = "none"  # default: "none"
#reportTypeCommentUsage = "none"  # default: "none"
#reportTypedDictNotRequiredAccess = "error"  # default: "error"
#reportUnboundVariable = "error"  # default: "error"
#reportUndefinedVariable = "error"  # default: "error"
#reportUnhashable = "error"  # default: "error"
#reportUninitializedInstanceVariable = "none"  # default: "none"
